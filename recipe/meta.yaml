{% set python_min = "3.11" %}
{% set name = "gmx_MMPBSA" %}
{% set version = "1.7.1" %}
{% set sha256 = "2b497bd7c031c47dfc9d9de7c9744cac64350c7e28ac139bb3a81864166a3208" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name|lower }}/{{ name|lower }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  entry_points:
    - gmx_MMPBSA = GMXMMPBSA.app:gmxmmpbsa
    - amber_MMPBSA = GMXMMPBSA.app:gmxmmpbsa_amber
    - gmx_MMPBSA_ana = GMXMMPBSA.app:gmxmmpbsa_ana
    - gmx_MMPBSA_test = GMXMMPBSA.app:gmxmmpbsa_test
  script: "{{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv"

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools <82
    - versioneer
    - wheel
  run:
    - python >={{ python_min }},<3.13
    - numpy >=1.26.4,<2
    - ambertools >=24.8,<27
    - gromacs >=2022,<2027
    - pyqt6
    - mpi4py >=4.0.1,<5
    - matplotlib-base >=3.8.0,<4
    - scipy >=1.14.1,<2
    - parmed >=4.2.2,<5
    - pandas >=2.2.0,<3
    - seaborn >=0.13.0,<0.14
    - tqdm
    - rich >=13,<16
    - git

test:
  imports:
    - GMXMMPBSA
  requires:
    - python {{ python_min }}
    - packaging
  files:
    - smoke_test.py
  commands:
    - gmx_MMPBSA -h
    - amber_MMPBSA -h
    - python smoke_test.py

about:
  home: https://github.com/Valdes-Tresanco-MS/gmx_MMPBSA
  license: GPL-3.0-or-later
  license_family: GPL
  license_file: LICENSE.txt
  summary: "gmx_MMPBSA is a new tool based on AMBER's MMPBSA.py aiming to perform end-state free energy calculations with GROMACS files."
  description: |
    gmx_MMPBSA is a new tool based on AMBER's MMPBSA.py aiming to perform end-state free energy calculations with 
    GROMACS files. It works with all GROMACS versions and also supports native AMBER inputs through amber_MMPBSA.
    Release testing covers GROMACS >=2022,<2027 and AmberTools >=24.8,<27 with Python >=3.11,<3.13.
    The Conda recipe selects these tested tool versions.
    The graphical analyzer uses PyQt6.
    Multiple calculations can be performed with gmx_MMPBSA such as Normal binding free energies, Alanine scanning, 
    Decomposition schemes, Entropy corrections, Stability and QM/MMGBSA
  doc_url: https://valdes-tresanco-ms.github.io/gmx_MMPBSA
  dev_url: https://github.com/Valdes-Tresanco-MS/gmx_MMPBSA

extra:
  recipe-maintainers:
    - Valdes-Tresanco-MS
    - marioernestovaldes
